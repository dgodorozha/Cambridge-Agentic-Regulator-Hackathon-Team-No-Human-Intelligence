<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url("fonts/JetBrainsMono-Regular.woff2") format("woff2")}
html,body{margin:0;height:100%;background:#0b0f16;overflow:hidden}
perspective-viewer{height:100%;width:100%;background:#0b0f16;color:#e4e9f2;
 font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11px;
 --plugin--background:#0b0f16;--icon--color:#97a3b8;--inactive--color:#5d6a80;--plugin--border:1px solid rgba(148,163,196,.14)}
#empty{color:#5d6a80;font:11.5px "IBM Plex Sans",sans-serif;padding:14px;line-height:1.5}
</style>
<link rel="stylesheet" href="psp/css/pro-dark.css">
</head><body>
<perspective-viewer theme="Pro Dark"></perspective-viewer>
<script type="module">
import perspective from "./psp/perspective.js";
import "./psp/perspective-viewer.js";
import "./psp/perspective-viewer-datagrid.js";
import "./psp/perspective-viewer-d3fc.js";
const qs = new URLSearchParams(location.search);
const run = qs.get("run") || "", v = qs.get("v") || "0";
async function j(u){try{const r=await fetch(u+(u.includes("?")?"&":"?")+"v="+v,{cache:"no-store"});
  if(!r.ok) return null; const t=await r.text(); return t==="null"?null:JSON.parse(t);}catch(e){return null;}}
let rows = run ? await j("/run/"+run+"/rows.json") : null;
if(!rows || !rows.length) rows = await j("rows_sample.json");
const cols = {scenario:"Scenario",family:"Family",sentinel:"Sentinel",quiet:"Quiet",holdout:"Held out",fidelity:"Fidelity",
  fidelity_moments:"Fidelity (moments)",f1:"Decision F1",precision:"Precision",recall:"Recall",lead_time:"Lead time",
  false_alert:"False alert",peak_stress:"Peak stress",n_flagged:"Flagged",post_shock_dd:"Post shock drawdown"};
const nice = s => typeof s === "string" && /^[A-Za-z][A-Za-z0-9]*(_[A-Za-z0-9]+)+$/.test(s)
  ? s.split("_").map((w,i)=> i===0 ? w.charAt(0).toUpperCase()+w.slice(1) : w).join(" ") : s;
rows = rows.map(r=>{const o={}; Object.keys(cols).forEach(c=>{const v=r[c]===undefined?null:r[c]; o[cols[c]]=(c==="scenario"||c==="family")?nice(v):v;}); return o;});
const worker = await perspective.worker();
const table = await worker.table(rows);
const el = document.querySelector("perspective-viewer");
await el.load(table);
await el.restore({group_by:["Sentinel"], split_by:["Family"], columns:["Decision F1"], aggregates:{"Decision F1":"avg"}});
</script><script>document.addEventListener('keydown', function (e) { var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return; if (e.key === 'Escape' || /^[0-9]$/.test(e.key) || /^[kdfasrgh]$/i.test(e.key)) { parent.postMessage({ hslKey: e.key }, '*'); } }, true);</script></body></html>
