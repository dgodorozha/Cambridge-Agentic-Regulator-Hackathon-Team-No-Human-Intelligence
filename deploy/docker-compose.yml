services:
  hsl:
    build: ..
    environment:
      HSL_AUTH_MODE: header
      HSL_USER_HEADER: X-Remote-User
      HSL_APPROVERS: ${HSL_APPROVERS:-}
      HSL_FOUR_EYES: "1"
      HSL_SECRET: ${HSL_SECRET:?set HSL_SECRET from the secret store}
      HSL_LLM: "off"
    volumes:
      - hsl-runs:/app/runs
    expose: ["8050"]           # not published: only the proxy reaches it
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8443:8443"]
    depends_on: [hsl]
volumes:
  hsl-runs:
